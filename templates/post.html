{% extends 'femicide.html' %}
{% load static %}

{% block body %}



  <!-- Form Section -->
  <div style="
      flex: 2;
      padding: 20px;
  ">
    <form method="post" enctype="multipart/form-data"
          class="form-control text-center shadow-lg bg-light p-4 rounded m-auto mb-4"
          style="max-width: 600px; ">
        {% csrf_token %}
        <h2 class="mb-4 text-danger fw-bold">We Listen!! Tell Us Your Story</h2>

        {% for field in form %}
            <div class="form-group mb-4">
                <label for="{{ field.id_for_label }}" class="form-label fw-semibold text-start d-block">
                    {{ field.label }}
                </label>
                {{ field }}
                {% if field.help_text %}
                    <small class="form-text text-muted d-block">{{ field.help_text }}</small>
                {% endif %}
                {% for error in field.errors %}
                    <div class="text-danger small mt-2">{{ error }}</div>
                {% endfor %}
            </div>
        {% endfor %}

        <button type="submit"
                class="btn btn-danger w-100 fw-bold text-uppercase p-2"
                style="background: #ff5f5f; border-color: #e04a4a; transition: 0.3s;">
            Post Story
        </button>
    </form>
  </div>





{% endblock %}
