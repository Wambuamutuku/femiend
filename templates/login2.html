{% extends 'femicide.html' %}
{% load static %}
{% block body %}

    <form method="post" action="{% url 'show' %}"
      style="max-width: 400px; margin: 10px auto ; padding: 20px; border: 1px solid #ddd; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">
    {% csrf_token %}

    <div class="d-flex align-items-center justify-content-center mb-4">
        <i class="fas fa-user-shield fa-3x" style="color: #E63946;"></i>
    </div>

    <p class="text-center h4 fw-bold mb-4" style="color: #E63946;">Admin Login</p>

    <div data-mdb-input-init class="form-outline mb-4">
        <input name="username" type="text" id="form2Example17" class="form-control form-control-lg"
               style="border-radius: 5px;" placeholder="Username" />
    </div>

    <div data-mdb-input-init class="form-outline mb-4">
        <input name="password" type="password" id="form2Example27" class="form-control form-control-lg"
               style="border-radius: 5px;" placeholder="Password" />
    </div>

    <div class="text-center">
        <button type="submit" class="btn btn-danger btn-lg"
                style="width: 100%; border-radius: 5px;">Login</button>
    </div>
</form>

{% endblock %}
